name: Build
on: [push, pull_request]

jobs:
  Build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build ToolCupboard.sln
    - name: Test
      run: dotnet test ToolCupboard.sln --no-build
